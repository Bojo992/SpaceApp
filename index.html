<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Space Codets</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        .sidebar {
            position: absolute;
            top: 16px;
            bottom: 16px;
            width: min(320px, 82vw);
            z-index: 1;
            transition: transform 0.6s;
        }
        .sidebar.left  { left: 16px; }
        .sidebar.right { right: 16px; }
        .left.collapsed  { transform: translateX(calc(-100% - 16px)); }
        .right.collapsed { transform: translateX(calc(100% + 16px)); }

        .sidebar-content {
            max-height: 100%;
            box-sizing: border-box;
            overflow-y: auto;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 0 50px -25px black;
            color: #333;
            font-size: 14px;
            line-height: 1.45;
        }

        .sidebar-toggle {
            position: absolute;
            top: 12px;
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            background: white;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
            font-size: 16px;
            cursor: pointer;
        }
        .sidebar-toggle:hover { color: #0aa1cf; }
        .sidebar-toggle.left  { right: -38px; }
        .sidebar-toggle.right { left: -38px; }
        .right.collapsed .sidebar-toggle { display: none; }

        h2 { margin: 0 0 6px; font-size: 18px; color: #222; }
        .coords { color: #777; margin-bottom: 10px; }
        .note { color: #888; font-size: 12px; }
        .sub { color: #999; font-size: 11px; font-weight: normal; }

        .status { display: inline-block; padding: 3px 10px; border-radius: 12px; color: white; font-weight: bold; font-size: 12px; }
        .status-good { background: #27ae60; }
        .status-poor { background: #c0392b; }
        .status-unknown { background: #7f8c8d; }
        .failing { color: #c0392b; margin: 8px 0 0; }

        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        td { padding: 6px 0; border-bottom: 1px solid #eee; vertical-align: top; }
        td.num { text-align: right; font-weight: bold; white-space: nowrap; padding-left: 10px; }
        .ok { color: #27ae60; }
        .bad { color: #c0392b; }

        .legend { list-style: none; padding: 0; margin: 12px 0; }
        .legend li { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
        .legend b { margin-left: auto; }

        .gradient-bar {
            position: relative;
            height: 10px;
            border-radius: 5px;
            margin: 12px 0 4px;
            background: linear-gradient(to right, #1a9850 0%, #66bd63 30%, #fee08b 50%, #f46d43 75%, #a50026 100%);
        }
        .gradient-bar .marker {
            position: absolute;
            top: 50%;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 0 1px #555;
            transform: translate(-50%, -50%);
        }
        .gradient-labels { display: flex; justify-content: space-between; font-size: 11px; color: #777; }
        .score { margin: 12px 0 4px; }
        .score-label { font-size: 13px; color: #555; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="left" class="sidebar left collapsed">
        <div id="summary" class="sidebar-content">Loading…</div>
        <button class="sidebar-toggle left" onclick="toggleSidebar('left')" aria-label="Toggle summary">☰</button>
    </div>

    <div id="right" class="sidebar right collapsed">
        <div id="site-details" class="sidebar-content"></div>
        <button class="sidebar-toggle right" onclick="setSidebar('right', false)" aria-label="Close site details">✕</button>
    </div>

    <script src="DAL.js"></script>
    <script src="Mapbox/rivers.js"></script>
    <script src="Mapbox/globe.js"></script>
</body>
</html>
